name: Chromium heavy build (retired)

# Retained as a manual notice for existing bookmarks. Chromium compilation is
# now handled only by chromium-build.yml on GitHub-hosted runners.
# This retired workflow has no schedule, checkout, Chromium sync, compiler, or
# artifact upload step.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Direct to hosted validation
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Explain the replacement workflow
        shell: pwsh
        run: |
          Write-Host 'This legacy workflow is retired; it does not sync or compile Chromium.'
          Write-Host 'Use the Chromium build validation workflow and select gn, targeted, or full.'
          Write-Host 'A standard runner is expected to report BLOCKED before source sync.'
