name: Chromium hosted Windows experiment (retired)

# Retained for existing bookmarks only. The historical standard-runner
# measurement is preserved in docs/CI-BUILD-FEASIBILITY.md. Use the unified
# chromium-build.yml workflow for all future Chromium validation.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Direct to hosted validation
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Explain the replacement workflow
        shell: pwsh
        run: |
          Write-Host 'This legacy experiment is retired; it does not sync or compile Chromium.'
          Write-Host 'Use the Chromium build validation workflow and select gn, targeted, or full.'
          Write-Host 'The standard runner is expected to report BLOCKED before source sync.'
